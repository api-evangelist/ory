    AuthenticatorTransport:
      description: 'Authenticators may implement various transports for communicating with clients. This enumeration defines hints as to

        how clients might communicate with a particular authenticator in order to obtain an assertion for a specific

        credential. Note that these hints represent the WebAuthn Relying Party''s best belief as to how an authenticator may

        be reached. A Relying Party will typically learn of the supported transports for a public key credential via

        getTransports().


        Specification: §5.8.4. Authenticator Transport Enumeration (https://www.w3.org/TR/webauthn/#enumdef-authenticatortransport)'
      title: AuthenticatorTransport represents the IDL enum with the same name.
      type: string
    authenticatorAssuranceLevel:
      description: 'The authenticator assurance level can be one of "aal1", "aal2", or "aal3". A higher number means that it is harder

        for an attacker to compromise the account.


        Generally, "aal1" implies that one authentication factor was used while AAL2 implies that two factors (e.g.

        password + TOTP) have been used.


        To learn more about these levels please head over to: https://www.ory.com/kratos/docs/concepts/credentials'
      enum:
      - aal0
      - aal1
      - aal2
      - aal3
      title: Authenticator Assurance Level (AAL)
      type: string
    jsonPatch:
      description: A JSONPatch document as defined by RFC 6902
      properties:
        from:
          description: 'This field is used together with operation "move" and uses JSON Pointer notation.


            Learn more [about JSON Pointers](https://datatracker.ietf.org/doc/html/rfc6901#section-5).'
          example: /name
          type: string
        op:
          description: The operation to be performed. One of "add", "remove", "replace", "move", "copy", or "test".
          example: replace
          type: string
        path:
          description: 'The path to the target path. Uses JSON pointer notation.


            Learn more [about JSON Pointers](https://datatracker.ietf.org/doc/html/rfc6901#section-5).'
          example: /name
          type: string
        value:
          description: 'The value to be used within the operations.


            Learn more [about JSON Pointers](https://datatracker.ietf.org/doc/html/rfc6901#section-5).'
          example: foobar
      required:
      - op
      - path
      type: object
