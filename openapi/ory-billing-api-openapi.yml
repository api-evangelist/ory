openapi: 3.2.0
info:
  title: Ory Network Billing API
  description: Ory is open-source identity and access infrastructure, delivered as the Ory Network managed cloud.
  version: '1.0'
  contact:
    name: Ory
    url: https://www.ory.com
  license:
    name: Apache-2.0
    url: https://github.com/ory/kratos/blob/master/LICENSE
servers:
- url: https://{project-slug}.projects.oryapis.com
  description: Ory Network project (Kratos, Hydra, Keto, Courier)
  variables:
    project-slug:
      default: your-project-slug
      description: The slug of your Ory Network project.
- url: https://api.console.ory.sh
  description: Ory Network Console API (control plane)
security:
- oryApiKey: []
tags:
- name: Billing
  description: Ory Network workspace / project subscriptions.
paths:
  /workspaces/{workspace}/subscription:
    parameters:
    - name: workspace
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getWorkspaceSubscription
      tags:
      - Billing
      summary: Get a workspace subscription
      servers:
      - url: https://api.console.ory.sh
      responses:
        '200':
          description: The active subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
    post:
      operationId: createWorkspaceSubscription
      tags:
      - Billing
      summary: Create or change a workspace subscription
      servers:
      - url: https://api.console.ory.sh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subscription'
      responses:
        '201':
          description: The created subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
components:
  schemas:
    Subscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        plan:
          type: string
          enum:
          - developer
          - production
          - growth
          - enterprise
        interval:
          type: string
          enum:
          - monthly
          - yearly
        currency:
          type: string
        status:
          type: string
  securitySchemes:
    oryApiKey:
      type: http
      scheme: bearer
      description: 'Ory API key. Project admin endpoints use an Ory project API key (ory_pat_...); Console endpoints use a workspace API key (ory_wak_...). Passed as `Authorization: Bearer <token>`.'
